<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenWallpaper Layer</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <video id="layer" autoplay muted loop playsinline></video>
    <script>
      const video = document.getElementById('layer')
      const src = new URLSearchParams(location.search).get('src')
      if (src) {
        video.src = src
        video.play().catch(() => {})
      }
    </script>
  </body>
</html>
